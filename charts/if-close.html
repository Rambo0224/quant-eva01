      const maxTicks = Math.max(4, Math.min(14, Math.round(width / 150)));
      const timestamps = [];
      (figure.data || []).forEach(function(trace) {
        (trace.x || []).forEach(function(value) {
          const time = Date.parse(value);
          if (!Number.isNaN(time)) timestamps.push(time);
        });
      });
      if (timestamps.length) {
        const spanDays = Math.max(1, (Math.max.apply(null, timestamps) - Math.min.apply(null, timestamps)) / 86400000);
        xaxis.nticks = spanDays <= 30 ? Math.max(4, Math.min(maxTicks, Math.round(spanDays) + 1)) : maxTicks;
        xaxis.tickformat = spanDays <= 75 ? '%Y-%m-%d' : (spanDays <= 900 ? '%Y-%m' : '%Y');
      } else {
        xaxis.nticks = maxTicks;
      }
      xaxis.tickmode = 'auto';
    }
    function renderChart() {
      if (!window.Plotly || !chartRoot) return;
      figure.layout = figure.layout || {};
      figure.layout.autosize = false;
      figure.layout.width = chartRoot.clientWidth;
      figure.layout.height = chartRoot.clientHeight;
      applyResponsiveTimeAxis();
      Plotly.react(chartRoot, figure.data, figure.layout, config).then(function () {
        chartRoot.style.visibility = 'visible';
      });
    }
    renderChart();
    window.addEventListener('load', renderChart);
    window.addEventListener('resize', function () {
      renderChart();
    });
  </script>
</body>
</html>
